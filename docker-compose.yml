# Agentic dev container.
#
# Two ways to run, sharing the same config (x-agent):
#
#   1) One-shot (ephemeral):
#        docker compose run --rm agent            # bash
#        docker compose run --rm agent opencode
#
#   2) Long-lived daemon (tmux sessions persist across attach/detach):
#        docker compose up -d agent-daemon
#        docker compose exec --user agent agent-daemon tmux new -s main
#        docker compose exec --user agent agent-daemon tmux attach -t main
#        docker compose stop agent-daemon         # when done
#
# Profiles: WORKSPACE_PROFILE (default MI) picks the workspace; GCLOUD_PROFILE,
# KUBE_PROFILE, WIREGUARD_PROFILE, CLAUDE_PROFILE and TAILSCALE_PROFILE each
# default to WORKSPACE_PROFILE. Or set WORKSPACE to an absolute host path.
#
# One long-lived container per profile (separate compose projects):
#   docker compose -p em-agent --env-file .env --env-file profiles/EM.env up -d agent-daemon
# (see profiles/*.env and README "Profiles").

# Shared base for both services.
x-agent: &agent
  build:
    context: .
    dockerfile: Dockerfile
  image: agent-box
  # No platform pin: the image builds and runs natively on the host's arch
  # (arm64 on Apple Silicon, amd64 on a Linux workstation).
  init: true
  stdin_open: true
  tty: true
  working_dir: /workspace

  # WireGuard + Tailscale (kernel mode) need these.
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun
  sysctls:
    - net.ipv4.ip_forward=1

  volumes:
    # Project: pick a profile dir with WORKSPACE_PROFILE, or set WORKSPACE to an
    # absolute host path to mount something outside ./workspaces/.
    - ${WORKSPACE:-./workspaces/${WORKSPACE_PROFILE:-MI}}:/workspace
    # Per-container config (NOT the host defaults). GCLOUD_PROFILE mounts a
    # subdir; WIREGUARD_PROFILE / KUBE_PROFILE select a file inside the dir.
    # Missing host dirs (e.g. configs/gcloud/EM on first run) are created empty.
    - ./configs/gcloud/${GCLOUD_PROFILE:-${WORKSPACE_PROFILE:-MI}}:/home/agent/.config/gcloud
    - ./configs/kube:/home/agent/.kube
    - ./configs/opencode:/home/agent/.config/opencode
    - ./configs/cursor:/home/agent/.cursor
    - ./configs/wireguard:/etc/wireguard
    # Claude Code state: credentials, settings, session transcripts AND the
    # global .claude.json (CLAUDE_CONFIG_DIR points here, see Dockerfile).
    - ./configs/claude/${CLAUDE_PROFILE:-${WORKSPACE_PROFILE:-MI}}:/home/agent/.claude
    # Tailscale node state (used only when TAILSCALE_ENABLE=1 or state exists).
    - ./configs/tailscale/${TAILSCALE_PROFILE:-${WORKSPACE_PROFILE:-MI}}:/var/lib/tailscale
    # Host Docker daemon (build/push from inside the container).
    - /var/run/docker.sock:/var/run/docker.sock

  environment:
    # opencode configs reference these via {env:...}; set in .env or your shell.
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - CURSOR_API_KEY=${CURSOR_API_KEY:-}
    # GitHub: a classic PAT (ghp_...) authenticates `gh` and `git` over HTTPS.
    - GH_TOKEN=${GH_TOKEN:-}
    - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    # Profile selection (each defaults to WORKSPACE_PROFILE, which defaults to MI).
    - WORKSPACE_PROFILE=${WORKSPACE_PROFILE:-MI}
    - GCLOUD_PROFILE=${GCLOUD_PROFILE:-${WORKSPACE_PROFILE:-MI}}
    # WireGuard: <P> -> /etc/wireguard/<P>.conf only (missing file = no tunnel);
    # "none" opts out; explicitly empty = legacy fallback (wg0.conf / any *.conf).
    - WIREGUARD_PROFILE=${WIREGUARD_PROFILE-${WORKSPACE_PROFILE:-MI}}
    - KUBE_PROFILE=${KUBE_PROFILE:-${WORKSPACE_PROFILE:-MI}}
    - KUBECONFIG=/home/agent/.kube/${KUBE_PROFILE:-${WORKSPACE_PROFILE:-MI}}
    - CLAUDE_PROFILE=${CLAUDE_PROFILE:-${WORKSPACE_PROFILE:-MI}}
    # Tailscale: started only when TAILSCALE_ENABLE=1 (or saved state exists).
    - TAILSCALE_ENABLE=${TAILSCALE_ENABLE:-0}
    - TAILSCALE_PROFILE=${TAILSCALE_PROFILE:-${WORKSPACE_PROFILE:-MI}}
    - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-}
    - TAILSCALE_EXTRA_ARGS=${TAILSCALE_EXTRA_ARGS:-}
    - TS_AUTHKEY=${TS_AUTHKEY:-}
    - GOCACHE=/workspace/.cache/go-build
    - GOPATH=/home/agent/go

services:
  # Long-lived: keeps the container (and any tmux server you start inside it)
  # alive across multiple `docker compose exec` sessions. Use `--user agent` on
  # exec so shells/tmux run as the unprivileged user (the entrypoint already
  # ran as root to bring up WireGuard).
  agent-daemon:
    <<: *agent
    command: ["sleep", "infinity"]
    # Back after a host reboot or a Docker restart — unless it was stopped
    # on purpose (docker stop / compose stop), which sticks across reboots.
    # The fleet inside comes back with `sol resume` (tmux-os: tos.sh boot).
    restart: unless-stopped
