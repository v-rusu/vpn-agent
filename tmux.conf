# ~/.tmux.conf — persisted-session setup.
# tmux-resurrect saves/restores session layout; tmux-continuum auto-saves into
# the mounted workspace. Auto-restore runs once on first client attach via a
# tmux hook (continuum's own background auto-restore is flaky in containers).

# ---- Basics ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ---- Plugins (pre-installed under ~/.tmux/plugins) ----
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save/restore layout into the mounted workspace (per-project).
set -g @resurrect-dir '/workspace/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'

# Continuum handles AUTO-SAVE only (status-refresh driven, reliable).
# Restore is done by the client-attached hook below (continuum's auto-restore
# background process gets SIGHUP'd in containers).
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Auto-restore the last save once, when the first client attaches.
set-hook -g client-attached 'run-shell -b "/home/agent/.tmux-restore-once.sh"'

# Manual keybinds (prefix = Ctrl-b): Ctrl-s save | Ctrl-r restore
run '~/.tmux/plugins/tpm/tpm'
